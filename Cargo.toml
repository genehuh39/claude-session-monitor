[package]
name = "claude-session-monitor"
version = "0.1.0"
edition = "2021"
description = "A native desktop dashboard that charts a live Claude Code session's token usage, cache behavior, cost, and tool calls"
license = "MIT"
repository = "https://github.com/genehuh39/claude-session-monitor"
readme = "README.md"
publish = false

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "8eb2fd211fcb6dee043382037eaab7a4162eff16" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "8eb2fd211fcb6dee043382037eaab7a4162eff16", features = ["font-kit", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
ureq = "3"

[profile.dev]
opt-level = 0
